name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Test weekly RSS generator
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Vet
        run: go vet ./...
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Validate model script
        run: bash -n scripts/download-model.sh
