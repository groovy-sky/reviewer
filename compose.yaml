services:
  model:
    image: ${REVIEWER_MODEL_IMAGE:-ghcr.io/groovy-sky/reviewer:nemotron-3-nano-4b}
    init: true
    command:
      - --model
      - /models/${REVIEWER_MODEL_FILENAME:-NVIDIA-Nemotron3-Nano-4B-Q4_K_M.gguf}
      - --alias
      - ${REVIEWER_MODEL_NAME:-nemotron-3-nano-4b}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${LLAMA_CTX_SIZE:-16384}
    ports:
      - 127.0.0.1:${LLAMA_HOST_PORT:-8080}:8080
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    stop_grace_period: 15s
